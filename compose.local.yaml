services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      assets:
        condition: service_completed_successfully
      database:
        condition: service_healthy

  assets:
    image: node:24-alpine
    user: "1000:1000"
    working_dir: /var/www/html
    command: sh -lc "npm install --ignore-scripts && npm run build"
    environment:
      NPM_CONFIG_CACHE: /tmp/npm-cache
    volumes:
      - .:/var/www/html

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: road_to_school
      MYSQL_USER: roadtoschool
      MYSQL_PASSWORD: roadtoschool_local
      MYSQL_ROOT_PASSWORD: root_local
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - roadtoschool_mysql84:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  roadtoschool_mysql84:
