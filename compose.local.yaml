services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment: &reverb-environment
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: roadtoschool-local
      REVERB_APP_KEY: roadtoschool-local-key
      REVERB_APP_SECRET: roadtoschool-local-secret
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    depends_on:
      assets:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      reverb:
        condition: service_started

  assets:
    image: node:24-alpine
    user: "1000:1000"
    working_dir: /var/www/html
    command: sh -lc "npm ci --ignore-scripts && npm run build"
    environment:
      NPM_CONFIG_CACHE: /tmp/npm-cache
      VITE_REVERB_APP_KEY: roadtoschool-local-key
      VITE_REVERB_HOST: localhost
      VITE_REVERB_PORT: 8080
      VITE_REVERB_SCHEME: http
    volumes:
      - .:/var/www/html

  reverb:
    build:
      context: .
      dockerfile: Dockerfile.local
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www/html
    environment: *reverb-environment

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: road_to_school
      MYSQL_USER: roadtoschool
      MYSQL_PASSWORD: roadtoschool_local
      MYSQL_ROOT_PASSWORD: root_local
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - roadtoschool_mysql84:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  roadtoschool_mysql84:
